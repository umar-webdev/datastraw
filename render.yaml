# Render blueprint: New > Blueprint > pick this repo. Render asks for the values marked `sync: false`.
services:
  - type: web
    name: verdant-support
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Supabase session pooler URI (port 5432)
        sync: false
      - key: WEBHOOK_SECRET
        value: verdant-demo-secret-2026
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: SEED_AGENT_EMAIL
        value: agent@verdant.test
      - key: SEED_AGENT_PASSWORD
        sync: false
